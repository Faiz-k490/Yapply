name: Bug report
description: Something in Yapply didn't work the way the README says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please use fictional data only. Never paste your real résumé, contact details, or `.yapply/` files here.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex
        - CLI directly
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yapply version
      description: The `version` in `.claude-plugin/plugin.json`.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The prompt or command you ran, step by step.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: Include any error text, with personal details removed.
    validations:
      required: true
